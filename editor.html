<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Content Editor – ISR Lab</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;color:#333}
    header{background:#c0392b;color:#fff;padding:16px 28px;display:flex;align-items:center;gap:14px}
    header h1{font-size:1.2rem;font-weight:700}
    header p{font-size:.82rem;opacity:.85}
    .tabs{display:flex;gap:0;background:#1a1a2e;padding:0 20px}
    .tab{padding:12px 22px;color:rgba(255,255,255,.6);cursor:pointer;font-size:.85rem;font-weight:600;border-bottom:3px solid transparent;transition:.2s}
    .tab.active{color:#f0a500;border-bottom-color:#f0a500}
    .container{max-width:1400px;margin:0 auto;padding:24px}
    .toolbar{display:flex;gap:10px;margin-bottom:18px;align-items:center}
    .btn{padding:9px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:600;transition:.2s}
    .btn-add{background:#c0392b;color:#fff}.btn-add:hover{background:#e74c3c}
    .btn-save{background:#27ae60;color:#fff}.btn-save:hover{background:#2ecc71}
    .btn-del{background:#e74c3c;color:#fff;padding:6px 14px;font-size:.78rem}.btn-del:hover{background:#c0392b}
    .btn-sm{background:#3498db;color:#fff;padding:5px 12px;font-size:.75rem;border-radius:6px}.btn-sm:hover{background:#2980b9}
    .card{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:20px;overflow:hidden}
    .card-header{background:#f8f9fa;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;cursor:pointer}
    .card-header h3{font-size:.95rem;font-weight:600;color:#1a1a2e}
    .card-body{padding:20px;display:none}
    .card-body.open{display:block}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
    .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:14px}
    label{display:block;font-size:.78rem;font-weight:600;color:#555;margin-bottom:5px}
    input,select{width:100%;padding:9px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:.85rem;font-family:inherit;transition:.2s}
    input:focus,select:focus{outline:none;border-color:#c0392b}
    .md-editor{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1.5px solid #ddd;border-radius:8px;overflow:hidden;margin-top:5px}
    .md-editor textarea{padding:12px;font-size:.83rem;font-family:'Courier New',monospace;border:none;outline:none;resize:none;min-height:180px;background:#fafafa;line-height:1.6}
    .md-preview{padding:12px;font-size:.83rem;border-left:1.5px solid #eee;min-height:180px;overflow-y:auto;line-height:1.7;background:#fff}
    .md-preview h4{margin:10px 0 6px;color:#c0392b;font-size:.9rem}
    .md-preview ul{padding-left:20px;margin:6px 0}
    .md-preview li{margin:3px 0}
    .md-preview p{margin:6px 0}
    .md-preview strong{color:#1a1a2e}
    .md-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
    .md-label-inner{display:grid;grid-template-columns:1fr 1fr;gap:0}
    .md-col-label{font-size:.73rem;font-weight:700;color:#888;padding:4px 10px;background:#f0f2f5;border-bottom:1px solid #eee}
    .tags-input{width:100%;padding:9px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:.85rem;font-family:inherit}
    .section-title{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#888;margin:16px 0 8px}
    .hint{font-size:.72rem;color:#999;margin-top:4px}
    .saved-msg{background:#d4edda;color:#155724;padding:10px 16px;border-radius:8px;font-size:.85rem;display:none;margin-bottom:12px}
    .error-msg{background:#f8d7da;color:#721c24;padding:10px 16px;border-radius:8px;font-size:.85rem;display:none;margin-bottom:12px}
    .color-dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px}
    @media(max-width:768px){.row,.row3,.md-editor{grid-template-columns:1fr}.md-preview{display:none}}
  </style>
</head>
<body>

<header>
  <div>
    <h1>✏️ ISR Lab – Content Editor</h1>
    <p>Edit berita dan riset website. Konten ditulis dalam Markdown — lihat preview langsung di sebelah kanan.</p>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('news')">📰 Berita / News</div>
  <div class="tab" onclick="switchTab('research')">🔬 Riset / Research</div>
  <div class="tab" onclick="switchTab('publications')">📄 Publikasi</div>
  <div class="tab" onclick="switchTab('courses')">📚 Kuliah</div>
</div>

<div class="container">
  <div id="savedMsg" class="saved-msg">✅ Berhasil disimpan ke content.json</div>
  <div id="errorMsg" class="error-msg"></div>

  <div class="toolbar">
    <button class="btn btn-add" onclick="addItem()">+ Tambah Item Baru</button>
    <button class="btn btn-save" onclick="saveAll()">💾 Simpan Semua</button>
    <span style="font-size:.8rem;color:#888;margin-left:8px">Klik judul card untuk buka/tutup</span>
  </div>

  <div id="itemList"></div>
</div>

<script>
let currentTab = 'news';
let data = { news: [], research: [] };

const colorOptions = ['red','green','blue','purple','orange'];
const colorMap = {
  red:    '#e74c3c',
  green:  '#27ae60',
  blue:   '#3498db',
  purple: '#8e44ad',
  orange: '#e67e22'
};

// ── Load JSON ──
async function loadData() {
  try {
    const res = await fetch('data/content.json?t=' + Date.now());
    data = await res.json();
    renderList();
  } catch(e) {
    showError('Gagal load content.json. Pastikan server Python sudah berjalan (python3 -m http.server 8080)');
  }
}

// ── Switch tab ──
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active',
      (i===0 && tab==='news') ||
      (i===1 && tab==='research') ||
      (i===2 && tab==='publications') ||
      (i===3 && tab==='courses')
    );
  });
  renderList();
}

// ── Render all items ──
function renderList() {
  const list = document.getElementById('itemList');
  list.innerHTML = '';
  const items = data[currentTab];
  if (!items || items.length === 0) {
    list.innerHTML = '<p style="color:#888;text-align:center;padding:40px">Belum ada item. Klik "+ Tambah Item Baru"</p>';
    return;
  }
  items.forEach((item, idx) => {
    list.appendChild(buildCard(item, idx));
  });
}

// ── Build card ──
function buildCard(item, idx) {
  const div = document.createElement('div');
  div.className = 'card';
  div.id = 'card_' + idx;

  const title = item['title_en'] || item['title_id'] || 'Item ' + (idx+1);

  if (currentTab === 'news') {
    div.innerHTML = buildNewsCard(item, idx, title);
  } else if (currentTab === 'research') {
    div.innerHTML = buildResearchCard(item, idx, title);
  } else if (currentTab === 'publications') {
    div.innerHTML = buildPublicationCard(item, idx, title);
  } else {
    div.innerHTML = buildCourseCard(item, idx, title);
  }

  // Toggle open/close
  div.querySelector('.card-header').addEventListener('click', (e) => {
    if (e.target.closest('button')) return;
    const body = div.querySelector('.card-body');
    body.classList.toggle('open');
  });

  // Live markdown preview
  div.querySelectorAll('textarea[data-preview]').forEach(ta => {
    const previewId = ta.getAttribute('data-preview');
    const preview = div.querySelector('#' + previewId);
    if (preview) {
      ta.addEventListener('input', () => {
        preview.innerHTML = marked.parse(ta.value || '');
      });
      // Initial render
      preview.innerHTML = marked.parse(ta.value || '');
    }
  });

  return div;
}

function buildNewsCard(item, idx, title) {
  return `
  <div class="card-header">
    <h3>📰 ${idx+1}. ${escHtml(title)}</h3>
    <button class="btn btn-del" onclick="deleteItem(${idx})">🗑 Hapus</button>

  <div class="card-body">
    <div class="row3">
      <div>
        <label>ID Unik</label>

      </div>
      <div>
        <label>Tanggal</label>
        <input type="text" value="${esc(item.date||'')}" onchange="updateField(${idx},'date',this.value)" placeholder="May 2026">
      </div>
      <div>
        <label>Icon (Font Awesome)</label>
        <input type="text" value="${esc(item.icon||'fa-newspaper')}" onchange="updateField(${idx},'icon',this.value)" placeholder="fa-robot">

    </div>
    <div class="row">
      <div>
        <label>Kategori (EN)</label>
        <input type="text" value="${esc(item.category_en||'')}" onchange="updateField(${idx},'category_en',this.value)">
      </div>
      <div>
        <label>Kategori (ID)</label>
        <input type="text" value="${esc(item.category_id||'')}" onchange="updateField(${idx},'category_id',this.value)">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Judul (EN)</label>
        <input type="text" value="${esc(item.title_en||'')}" onchange="updateField(${idx},'title_en',this.value)">
      </div>
      <div>
        <label>Judul (ID)</label>
        <input type="text" value="${esc(item.title_id||'')}" onchange="updateField(${idx},'title_id',this.value)">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Ringkasan (EN)</label>
        <input type="text" value="${esc(item.summary_en||'')}" onchange="updateField(${idx},'summary_en',this.value)">
      </div>
      <div>
        <label>Ringkasan (ID)</label>
        <input type="text" value="${esc(item.summary_id||'')}" onchange="updateField(${idx},'summary_id',this.value)">
      </div>
    </div>

    <div class="section-title">Konten Lengkap (Markdown)</div>
    <div class="md-label-inner">
      <div class="md-col-label">✍️ Tulis (EN)</div>
      <div class="md-col-label">👁 Preview</div>
    </div>
    <div class="md-editor">
      <textarea data-preview="prev_en_${idx}" onchange="updateField(${idx},'content_en',this.value)"
        placeholder="Tulis konten bahasa Inggris di sini...&#10;&#10;Contoh:&#10;Ini paragraf pertama.&#10;&#10;#### Judul Section&#10;&#10;- poin satu&#10;- poin dua&#10;&#10;**Teks tebal**"
      >${escHtml(item.content_en||'')}</textarea>
      <div class="md-preview" id="prev_en_${idx}"></div>
    </div>
    <div style="margin-top:12px"></div>
    <div class="md-label-inner">
      <div class="md-col-label">✍️ Tulis (ID)</div>
      <div class="md-col-label">👁 Preview</div>
    </div>
    <div class="md-editor">
      <textarea data-preview="prev_id_${idx}" onchange="updateField(${idx},'content_id',this.value)"
        placeholder="Tulis konten bahasa Indonesia di sini..."
      >${escHtml(item.content_id||'')}</textarea>
      <div class="md-preview" id="prev_id_${idx}"></div>
    </div>

    <div class="row" style="margin-top:16px">
      <div>
        <label>Gambar (nama file, pisah koma)</label>
        <input type="text" value="${esc(Array.isArray(item.images)?item.images.join(', '):(item.images||''))}"
          onchange="updateImages(${idx},this.value)" placeholder="foto1.jpg, foto2.jpg">
        <div class="hint">Taruh file di folder: assets/images/news/</div>
      </div>
      <div>
        <label>Link YouTube</label>
        <input type="text" value="${esc(item.youtube||'')}" onchange="updateField(${idx},'youtube',this.value||null)"
          placeholder="https://youtu.be/xxxxx">
      </div>
    </div>
  </div>`;
}

function buildResearchCard(item, idx, title) {
  const colorOpts = colorOptions.map(c =>
    `<option value="${c}" ${item.color===c?'selected':''}>${c}</option>`
  ).join('');
  return `
  <div class="card-header">
    <h3>🔬 ${idx+1}. ${escHtml(title)}</h3>
    <button class="btn btn-del" onclick="deleteItem(${idx})">🗑 Hapus</button>
  </div>
  <div class="card-body">
    <div class="row3">
      <div>
        <label>ID Unik</label>
        <input type="text" value="${esc(item.id||'')}" onchange="updateField(${idx},'id',this.value)" placeholder="r1, r2, ...">
      </div>
      <div>
        <label>Badge TKT</label>
        <input type="text" value="${esc(item.tkt||'')}" onchange="updateField(${idx},'tkt',this.value)" placeholder="TKT 1–3">
      </div>
      <div>
        <label>Warna Badge</label>
        <select onchange="updateField(${idx},'color',this.value)">${colorOpts}</select>
      </div>
    </div>
    <div class="row">
      <div>
        <label>Icon (Font Awesome)</label>
        <input type="text" value="${esc(item.icon||'fa-flask')}" onchange="updateField(${idx},'icon',this.value)" placeholder="fa-robot">
      </div>
      <div>
        <label>Tags (pisah koma)</label>
        <input type="text" class="tags-input" value="${esc((item.tags||[]).join(', '))}"
          onchange="updateTags(${idx},this.value)" placeholder="ROS2, LiDAR, Python">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Judul (EN)</label>
        <input type="text" value="${esc(item.title_en||'')}" onchange="updateField(${idx},'title_en',this.value)">
      </div>
      <div>
        <label>Judul (ID)</label>
        <input type="text" value="${esc(item.title_id||'')}" onchange="updateField(${idx},'title_id',this.value)">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Ringkasan (EN)</label>
        <input type="text" value="${esc(item.summary_en||'')}" onchange="updateField(${idx},'summary_en',this.value)">
      </div>
      <div>
        <label>Ringkasan (ID)</label>
        <input type="text" value="${esc(item.summary_id||'')}" onchange="updateField(${idx},'summary_id',this.value)">
      </div>
    </div>

    <div class="section-title">Konten Lengkap (Markdown)</div>
    <div class="md-label-inner">
      <div class="md-col-label">✍️ Tulis (EN)</div>
      <div class="md-col-label">👁 Preview</div>
    </div>
    <div class="md-editor">
      <textarea data-preview="prev_en_${idx}" onchange="updateField(${idx},'content_en',this.value)"
        placeholder="Tulis konten bahasa Inggris...&#10;&#10;Contoh:&#10;#### Research Highlights&#10;&#10;- point one&#10;- point two&#10;&#10;**Open for:** S1, S2, S3"
      >${escHtml(item.content_en||'')}</textarea>
      <div class="md-preview" id="prev_en_${idx}"></div>
    </div>
    <div style="margin-top:12px"></div>
    <div class="md-label-inner">
      <div class="md-col-label">✍️ Tulis (ID)</div>
      <div class="md-col-label">👁 Preview</div>
    </div>
    <div class="md-editor">
      <textarea data-preview="prev_id_${idx}" onchange="updateField(${idx},'content_id',this.value)"
        placeholder="Tulis konten bahasa Indonesia..."
      >${escHtml(item.content_id||'')}</textarea>
      <div class="md-preview" id="prev_id_${idx}"></div>
    </div>

    <div class="row" style="margin-top:16px">
      <div>
        <label>Gambar (nama file, pisah koma)</label>
        <input type="text" value="${esc(Array.isArray(item.images)?item.images.join(', '):(item.images||''))}"
          onchange="updateImages(${idx},this.value)" placeholder="foto.jpg">
        <div class="hint">Taruh file di folder: assets/images/research/</div>
      </div>
      <div>
        <label>Link YouTube</label>
        <input type="text" value="${esc(item.youtube||'')}" onchange="updateField(${idx},'youtube',this.value||null)"
          placeholder="https://youtu.be/xxxxx">
      </div>
    </div>
  </div>`;
}

function buildPublicationCard(item, idx, title) {
  return `
  <div class="card-header">
    <h3>📄 ${idx+1}. ${escHtml(title)}</h3>
    <button class="btn btn-del" onclick="deleteItem(${idx})">🗑 Hapus</button>
  </div>
  <div class="card-body">
    <div class="row3">
      <div>
        <label>ID Unik</label>
        <input type="text" value="${esc(item.id||'')}" onchange="updateField(${idx},'id',this.value)" placeholder="p1, p2, ...">
      </div>
      <div>
        <label>Tahun</label>
        <input type="text" value="${esc(item.year||'')}" onchange="updateField(${idx},'year',this.value)" placeholder="2025">
      </div>
      <div>
        <label>Badge (nama jurnal/Q)</label>
        <input type="text" value="${esc(item.badge||'')}" onchange="updateField(${idx},'badge',this.value)" placeholder="Q1 Journal / Sinta S2">
      </div>
    </div>
    <div style="margin-bottom:14px">
      <label>Judul Artikel</label>
      <input type="text" value="${esc(item.title||'')}" onchange="updateField(${idx},'title',this.value)" placeholder="Judul artikel lengkap">
    </div>
    <div class="row">
      <div>
        <label>Penulis</label>
        <input type="text" value="${esc(item.authors||'')}" onchange="updateField(${idx},'authors',this.value)" placeholder="Anam, K., et al.">
      </div>
      <div>
        <label>Nama Jurnal / Prosiding</label>
        <input type="text" value="${esc(item.journal||'')}" onchange="updateField(${idx},'journal',this.value)" placeholder="Neural Computing & Applications (2025)">
      </div>

    <div style="margin-bottom:14px">
      <label>🔗 Link DOI / URL Artikel</label>

function buildCourseCard(item, idx, title) {
  const levelOpts = ['S1','S2','S3'].map(l =>
    `<option value="${l}" ${item.level===l?'selected':''}>${l}</option>`).join('');
  return `
  <div class="card-header">
    <h3>📚 ${idx+1}. ${escHtml(title)}</h3>
    <button class="btn btn-del" onclick="deleteItem(${idx})">🗑 Hapus</button>
  </div>
  <div class="card-body">
    <div class="row3">
      <div>
        <label>ID Unik</label>
        <input type="text" value="${esc(item.id||'')}" onchange="updateField(${idx},'id',this.value)" placeholder="c1, c2, ...">
      </div>
      <div>
        <label>Kode MK</label>
        <input type="text" value="${esc(item.code||'')}" onchange="updateField(${idx},'code',this.value)" placeholder="TKE3201">
      </div>
      <div>

        <select onchange="updateField(${idx},'level',this.value)">${levelOpts}</select>
      </div>
    </div>
    <div class="row3">
      <div>
        <label>SKS</label>
        <input type="number" value="${esc(String(item.credits||3))}" onchange="updateField(${idx},'credits',parseInt(this.value))" min="1" max="6">
      </div>
      <div>
        <label>Semester (EN)</label>
        <input type="text" value="${esc(item.semester_en||'')}" onchange="updateField(${idx},'semester_en',this.value)" placeholder="Odd 2025/2026">
      </div>
      <div>
        <label>Semester (ID)</label>
        <input type="text" value="${esc(item.semester_id||'')}" onchange="updateField(${idx},'semester_id',this.value)" placeholder="Ganjil 2025/2026">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Nama MK (EN)</label>
        <input type="text" value="${esc(item.name_en||'')}" onchange="updateField(${idx},'name_en',this.value)">
      </div>
      <div>
        <label>Nama MK (ID)</label>
        <input type="text" value="${esc(item.name_id||'')}" onchange="updateField(${idx},'name_id',this.value)">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Deskripsi singkat (EN)</label>
        <input type="text" value="${esc(item.desc_en||'')}" onchange="updateField(${idx},'desc_en',this.value)">
      </div>
      <div>
        <label>Deskripsi singkat (ID)</label>
        <input type="text" value="${esc(item.desc_id||'')}" onchange="updateField(${idx},'desc_id',this.value)">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Jadwal (EN)</label>
        <input type="text" value="${esc(item.schedule_en||'')}" onchange="updateField(${idx},'schedule_en',this.value)" placeholder="Monday 08:00–10:30, Lab Robotika">
      </div>
      <div>
        <label>Jadwal (ID)</label>
        <input type="text" value="${esc(item.schedule_id||'')}" onchange="updateField(${idx},'schedule_id',this.value)" placeholder="Senin 08:00–10:30, Lab Robotika">
      </div>
    </div>

    <div class="section-title">Konten / Silabus (Markdown)</div>
    <div class="md-label-inner">
      <div class="md-col-label">✍️ Tulis (EN)</div>
      <div class="md-col-label">👁 Preview</div>
    </div>
    <div class="md-editor">
      <textarea data-preview="cprev_en_${idx}" onchange="updateField(${idx},'content_en',this.value)"
        placeholder="#### Topics Covered&#10;&#10;- Topic one&#10;- Topic two&#10;&#10;#### Assessment&#10;&#10;- Exam: 40%&#10;- Project: 60%"
      >${escHtml(item.content_en||'')}</textarea>
      <div class="md-preview" id="cprev_en_${idx}"></div>
    </div>
    <div style="margin-top:12px"></div>
    <div class="md-label-inner">
      <div class="md-col-label">✍️ Tulis (ID)</div>
      <div class="md-col-label">👁 Preview</div>
    </div>
    <div class="md-editor">
      <textarea data-preview="cprev_id_${idx}" onchange="updateField(${idx},'content_id',this.value)"
        placeholder="#### Topik yang Dibahas&#10;&#10;- Topik satu&#10;- Topik dua"
      >${escHtml(item.content_id||'')}</textarea>
      <div class="md-preview" id="cprev_id_${idx}"></div>
    </div>

    <div class="row" style="margin-top:16px">
      <div>
        <label>🔗 Link Silabus (PDF/Drive)</label>
        <input type="url" value="${esc(item.syllabus_url||'')}" onchange="updateField(${idx},'syllabus_url',this.value)"
          placeholder="https://drive.google.com/...">
        <div class="hint">Akan muncul tombol "Download Silabus" di popup</div>
      </div>
      <div>
        <label>Link YouTube (video kuliah)</label>
        <input type="text" value="${esc(item.youtube||'')}" onchange="updateField(${idx},'youtube',this.value||null)"
          placeholder="https://youtu.be/xxxxx">
      </div>
    </div>
  </div>`;
}

// ── Data updates ──
function updateField(idx, field, value) {
  data[currentTab][idx][field] = value === '' ? null : value;
}
function updateImages(idx, value) {
  const parts = value.split(',').map(s => s.trim()).filter(Boolean);
  data[currentTab][idx].images = parts.length === 0 ? null : parts.length === 1 ? parts[0] : parts;
}
function updateTags(idx, value) {
  data[currentTab][idx].tags = value.split(',').map(s => s.trim()).filter(Boolean);
}

// ── Delete item ──
function deleteItem(idx) {
  if (!confirm('Hapus item ini?')) return;
  data[currentTab].splice(idx, 1);
  renderList();
}

// ── Save to file ──
async function saveAll() {
  const json = JSON.stringify(data, null, 2);
  try {
    // Try saving via server (needs Python server with write support — won't work with basic http.server)
    // Instead, download the file
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'content.json';
    a.click();
    URL.revokeObjectURL(url);
    showSaved();
  } catch(e) {
    showError('Gagal menyimpan: ' + e.message);
  }
}

function showSaved() {
  const el = document.getElementById('savedMsg');
  el.style.display = 'block';
  el.innerHTML = '✅ File <strong>content.json</strong> berhasil didownload! Pindahkan ke folder <code>data/</code> untuk mengganti file lama.';
  setTimeout(() => el.style.display = 'none', 8000);
}
function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 8000);
}

// ── Helpers ──
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;') }
function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

// ── Init ──
loadData();
</script>
