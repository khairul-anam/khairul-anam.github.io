<!doctype html>
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>News & Activities – Prof. Khairul Anam | ISR Lab UNEJ</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet"/>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DHTXGR676K"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DHTXGR676K');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root{
      --red:#c0392b;--red2:#e74c3c;--gold:#f0a500;
      --dark:#1a1a2e;--navy:#16213e;--grey:#6b7280;
      --light:#f8f9fa;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{font-family:'Poppins',sans-serif;color:#333;background:#fff}

    /* NAVBAR */
    nav{position:fixed;top:0;width:100%;z-index:1000;background:rgba(26,26,46,.96);
      backdrop-filter:blur(10px);padding:0 5%;display:flex;align-items:center;
      justify-content:space-between;height:68px;box-shadow:0 2px 20px rgba(0,0,0,.3)}
    .nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
    .nav-logo span{color:#fff;font-weight:700;font-size:1.1rem}
    .nav-logo span em{color:var(--gold);font-style:normal}
    .nav-links{display:flex;gap:24px;list-style:none;align-items:center}
    .nav-links a{color:rgba(255,255,255,.8);text-decoration:none;font-size:.85rem;
      font-weight:500;transition:color .2s}
    .nav-links a:hover,.nav-links a.active{color:var(--gold)}
    .lang-btn{background:var(--red);color:#fff;border:none;border-radius:20px;
      padding:5px 16px;font-size:.8rem;font-family:'Poppins',sans-serif;
      font-weight:600;cursor:pointer;transition:background .2s}
    .lang-btn:hover{background:var(--red2)}

    /* HERO */
    .page-hero{padding:110px 5% 50px;background:linear-gradient(135deg,var(--dark),var(--navy),#0d3b6e);
      text-align:center;position:relative;overflow:hidden}
    .page-hero::before{content:'';position:absolute;top:-150px;right:-150px;width:400px;height:400px;
      border-radius:50%;background:radial-gradient(circle,rgba(192,57,43,.2),transparent 70%)}
    .page-hero h1{font-size:2.4rem;font-weight:800;color:#fff;margin-bottom:10px}
    .page-hero h1 em{color:var(--gold);font-style:normal}
    .page-hero p{color:rgba(255,255,255,.75);font-size:1rem;max-width:600px;margin:0 auto}
    .breadcrumb{margin-bottom:16px;font-size:.82rem}
    .breadcrumb a{color:var(--gold);text-decoration:none}
    .breadcrumb span{color:rgba(255,255,255,.5);margin:0 6px}

    /* TOOLBAR */
    .toolbar{background:#fff;border-bottom:1px solid #eee;padding:14px 5%;
      display:flex;flex-wrap:wrap;gap:12px;align-items:center;
      position:sticky;top:68px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.05)}
    .search-box{display:flex;align-items:center;gap:8px;background:#f5f5f5;
      border-radius:24px;padding:8px 16px;flex:1;min-width:200px;max-width:320px}
    .search-box i{color:#aaa;font-size:.85rem}
    .search-box input{border:none;background:none;outline:none;font-size:.85rem;
      font-family:'Poppins',sans-serif;width:100%;color:#333}
    .filter-group{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .filter-label{font-size:.78rem;font-weight:600;color:#888}
    .filter-btn{padding:6px 16px;border-radius:20px;border:1.5px solid #ddd;
      background:#fff;font-size:.8rem;font-weight:600;cursor:pointer;
      transition:.2s;font-family:'Poppins',sans-serif;color:#555}
    .filter-btn:hover{border-color:var(--red);color:var(--red)}
    .filter-btn.active{background:var(--red);color:#fff;border-color:var(--red)}
    .result-count{font-size:.8rem;color:#aaa;margin-left:auto}

    /* MAIN */
    .main{max-width:1200px;margin:0 auto;padding:40px 5%}

    /* NEWS GRID */
    .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
    .news-card{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);
      overflow:hidden;cursor:pointer;transition:transform .25s,box-shadow .25s;
      border:1.5px solid #f0f0f0;display:flex;flex-direction:column}
    .news-card:hover{transform:translateY(-5px);box-shadow:0 8px 32px rgba(0,0,0,.13)}
    .news-img{height:180px;background:linear-gradient(135deg,var(--dark),var(--navy));
      display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .news-img i{font-size:2.5rem;color:rgba(255,255,255,.3)}
    .news-body{padding:18px;flex:1;display:flex;flex-direction:column}
    .news-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .news-date{font-size:.75rem;color:#aaa;font-weight:500}
    .news-cat{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:20px;
      letter-spacing:.3px}
    .cat-research{background:#fef3e2;color:#e67e22}
    .cat-teaching{background:#eaf4fb;color:#2980b9}
    .cat-community{background:#e8f8f0;color:#27ae60}
    .cat-default{background:#f5f5f5;color:#666}
    .news-title{font-size:.95rem;font-weight:700;color:var(--dark);margin-bottom:8px;line-height:1.4}
    .news-summary{font-size:.82rem;color:var(--grey);line-height:1.6;flex:1}
    .news-readmore{margin-top:14px;font-size:.78rem;font-weight:600;color:var(--red);
      display:flex;align-items:center;gap:6px}

    /* EMPTY */
    .empty{text-align:center;padding:80px 20px;color:#aaa;grid-column:1/-1}
    .empty i{font-size:3rem;margin-bottom:16px;display:block}
    .empty p{font-size:.9rem}

    /* LOAD MORE */
    .load-more-wrap{text-align:center;margin-top:40px}
    .load-more-btn{background:#fff;border:2px solid var(--red);color:var(--red);
      padding:11px 32px;border-radius:8px;font-size:.88rem;font-weight:600;
      cursor:pointer;font-family:'Poppins',sans-serif;transition:.2s}
    .load-more-btn:hover{background:var(--red);color:#fff}

    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;
      display:flex;align-items:center;justify-content:center;padding:20px;
      opacity:0;visibility:hidden;transition:.25s}
    .modal-overlay.open{opacity:1;visibility:visible}
    .modal-box{background:#fff;border-radius:18px;width:100%;max-width:720px;
      max-height:88vh;overflow-y:auto;animation:modalIn .25s ease;
      box-shadow:0 20px 60px rgba(0,0,0,.25)}
    @keyframes modalIn{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
    .modal-header{padding:22px 26px 16px;border-bottom:1px solid #f0f0f0;
      display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
      position:sticky;top:0;background:#fff;z-index:1}
    .modal-badge{font-size:.75rem;font-weight:700;padding:3px 12px;border-radius:20px;
      margin-bottom:6px;display:inline-block}
    .modal-header h2{font-size:1.2rem;font-weight:700;color:var(--dark);line-height:1.3}
    .modal-close{background:none;border:none;font-size:1.3rem;cursor:pointer;
      color:#999;padding:4px;flex-shrink:0;transition:color .2s}
    .modal-close:hover{color:var(--red)}
    .modal-body{padding:22px 26px}
    .modal-body h4{font-size:.92rem;font-weight:700;color:var(--red);margin:16px 0 8px}
    .modal-body h4:first-child{margin-top:0}
    .modal-body p{font-size:.88rem;color:#444;line-height:1.75;margin-bottom:10px}
    .modal-body ul{padding-left:20px;margin-bottom:10px}
    .modal-body ul li{font-size:.88rem;color:#444;line-height:1.75;margin-bottom:3px}
    .modal-body strong{color:var(--dark)}
    .modal-image{width:100%;border-radius:10px;margin-top:16px;max-height:320px;
      object-fit:cover;cursor:zoom-in}
    .modal-image-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
      gap:8px;margin-top:16px}
    .modal-image-gallery img{width:100%;height:110px;object-fit:cover;border-radius:8px;cursor:zoom-in}
    .modal-youtube-wrap{margin-top:20px;border-top:1px solid #eee;padding-top:16px}
    .modal-youtube-label{font-size:.78rem;font-weight:700;color:#555;
      margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
    .modal-youtube{position:relative;padding-bottom:56.25%;height:0;
      overflow:hidden;border-radius:10px;max-width:560px}
    .modal-youtube iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}

    /* LIGHTBOX */
    .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:3000;
      display:none;align-items:center;justify-content:center}
    .lightbox.open{display:flex}
    .lightbox img{max-width:90vw;max-height:90vh;border-radius:8px}
    .lightbox-close{position:absolute;top:20px;right:28px;color:#fff;
      font-size:2rem;cursor:pointer;background:none;border:none}

    @media(max-width:768px){
      .page-hero h1{font-size:1.7rem}
      .news-grid{grid-template-columns:1fr}
      .nav-links{display:none}
      .toolbar{flex-direction:column;align-items:stretch}
      .search-box{max-width:100%}
      .result-count{margin-left:0}
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">
    <span>Khairul <em>Anam</em></span>
  </a>
  <ul class="nav-links">
    <li><a href="index.html#about" data-en="About" data-id="Tentang">About</a></li>
    <li><a href="index.html#research" data-en="Research" data-id="Riset">Research</a></li>
    <li><a href="index.html#publications" data-en="Publications" data-id="Publikasi">Publications</a></li>
    <li><a href="courses.html" data-en="Teaching" data-id="Kuliah">Teaching</a></li>
    <li><a href="news.html" class="active" data-en="News" data-id="Berita">News</a></li>
    <li><a href="index.html#contact" data-en="Contact" data-id="Kontak">Contact</a></li>
    <li><button class="lang-btn" onclick="toggleLang()" id="langBtn">🌐 ID</button></li>
  </ul>
</nav>

<div class="page-hero">
  <div class="breadcrumb">
    <a href="index.html">Home</a>
    <span>›</span>
    <span style="color:#fff" data-en="News & Activities" data-id="Berita & Aktivitas">News & Activities</span>
  </div>
  <h1 data-en="News & <em>Activities</em>" data-id="Berita & <em>Aktivitas</em>">
    News & <em>Activities</em>
  </h1>
  <p data-en="Latest updates from ISR Lab — research milestones, teaching activities, and community service."
     data-id="Update terbaru dari ISR Lab — capaian riset, kegiatan pengajaran, dan pengabdian masyarakat.">
    Latest updates from ISR Lab — research milestones, teaching activities, and community service.
  </p>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="search-box">
    <i class="fas fa-search"></i>
    <input type="text" id="searchInput"
      placeholder="Search news..."
      data-en-placeholder="Search news..."
      data-id-placeholder="Cari berita..."
      oninput="applyFilters()">
  </div>
  <div class="filter-group">
    <span class="filter-label" data-en="Category:" data-id="Kategori:">Category:</span>
    <button class="filter-btn active" onclick="setFilter('all')" data-en="All" data-id="Semua">All</button>
    <button class="filter-btn" onclick="setFilter('Research')" data-en="Research" data-id="Riset">Research</button>
    <button class="filter-btn" onclick="setFilter('Teaching')" data-en="Teaching" data-id="Pengajaran">Teaching</button>
    <button class="filter-btn" onclick="setFilter('Community')" data-en="Community Service" data-id="Pengabdian">Community</button>
  </div>
  <span class="result-count" id="resultCount"></span>
</div>

<div class="main">
  <div class="news-grid" id="newsGrid">
    <div class="empty"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div>
  </div>
  <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
    <button class="load-more-btn" onclick="loadMore()"
      data-en="Load More" data-id="Tampilkan Lebih Banyak">Load More</button>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-box" id="modalBox">
    <div class="modal-header">
      <div style="flex:1">
        <div class="modal-badge" id="modalBadge"></div>
        <h2 id="modalTitle"></h2>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalContent"></div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
  AOS.init({ once:true, duration:600 });

  let currentLang = 'en';
  let allNews = [];
  let currentFilter = 'all';
  let currentSearch = '';
  let visibleCount = 9;
  const PAGE_SIZE = 9;

  const catColors = {
    'research':'cat-research','riset':'cat-research',
    'teaching':'cat-teaching','pengajaran':'cat-teaching',
    'community service':'cat-community','pengabdian':'cat-community'
  };

  function getCatClass(cat) {
    return catColors[(cat||'').toLowerCase()] || 'cat-default';
  }

  // ── LANG TOGGLE ──
  function toggleLang() {
    currentLang = currentLang === 'en' ? 'id' : 'en';
    document.getElementById('langBtn').textContent = currentLang === 'en' ? '🌐 ID' : '🌐 EN';
    document.querySelectorAll('[data-en]').forEach(el => {
      const val = el.getAttribute('data-' + currentLang);
      if (val) el.innerHTML = val;
    });
    // Update search placeholder
    const si = document.getElementById('searchInput');
    si.placeholder = si.getAttribute('data-' + currentLang + '-placeholder') || si.placeholder;
    applyFilters();
  }

  // ── FILTER ──
  function setFilter(f) {
    currentFilter = f;
    visibleCount = PAGE_SIZE;
    document.querySelectorAll('.filter-btn').forEach(btn => {
      const en = btn.getAttribute('data-en') || btn.textContent;
      const id = btn.getAttribute('data-id') || btn.textContent;
      const match = f === 'all'
        ? (en === 'All' || id === 'Semua')
        : (en.toLowerCase().includes(f.toLowerCase()) || id.toLowerCase().includes(f.toLowerCase()));
      btn.classList.toggle('active', match);
    });
    applyFilters();
  }

  // ── APPLY FILTERS ──
  function applyFilters() {
    currentSearch = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allNews.filter(n => {
      const title   = (n['title_'   + currentLang] || n.title_en || '').toLowerCase();
      const summary = (n['summary_' + currentLang] || n.summary_en || '').toLowerCase();
      const cat_en  = (n.category_en || '').toLowerCase();
      const cat_id  = (n.category_id || '').toLowerCase();
      const matchSearch = !currentSearch || title.includes(currentSearch) || summary.includes(currentSearch);
      const matchFilter = currentFilter === 'all' ||
        cat_en.includes(currentFilter.toLowerCase()) ||
        cat_id.includes(currentFilter.toLowerCase());
      return matchSearch && matchFilter;
    });
    renderGrid(filtered);
  }

  // ── RENDER GRID ──
  function renderGrid(items) {
    const grid = document.getElementById('newsGrid');
    const shown = items.slice(0, visibleCount);
    document.getElementById('resultCount').textContent =
      items.length + (currentLang === 'en' ? ' articles' : ' artikel');

    if (!shown.length) {
      grid.innerHTML = `<div class="empty">
        <i class="fas fa-newspaper"></i>
        <p>${currentLang === 'en' ? 'No articles found.' : 'Tidak ada artikel ditemukan.'}</p>
      </div>`;
      document.getElementById('loadMoreWrap').style.display = 'none';
      return;
    }

    grid.innerHTML = '';
    shown.forEach((n, i) => {
      const title   = n['title_'    + currentLang] || n.title_en;
      const summary = n['summary_'  + currentLang] || n.summary_en;
      const cat     = n['category_' + currentLang] || n.category_en;

      const thumb = n.images
        ? (Array.isArray(n.images) ? n.images[0] : n.images)
        : null;
      const thumbPath = thumb ? `assets/images/news/${thumb}` : null;

      const imgHtml = thumbPath
        ? `<div class="news-img" style="background:none;padding:0;">
             <img src="${thumbPath}" style="width:100%;height:100%;object-fit:cover;"
               onerror="this.parentElement.innerHTML='<i class=\\'fas ${n.icon}\\'></i>';this.parentElement.style='';">
           </div>`
        : `<div class="news-img"><i class="fas ${n.icon || 'fa-newspaper'}"></i></div>`;

      const card = document.createElement('div');
      card.className = 'news-card';
      card.setAttribute('data-aos', 'fade-up');
      card.setAttribute('data-aos-delay', String((i % 3) * 60));
      card.innerHTML = `
        ${imgHtml}
        <div class="news-body">
          <div class="news-meta">
            <span class="news-date">${n.date || ''}</span>
            <span class="news-cat ${getCatClass(cat)}">${cat}</span>
          </div>
          <div class="news-title">${title}</div>
          <div class="news-summary">${summary}</div>
          <div class="news-readmore">
            <span data-en="Read more" data-id="Baca selengkapnya">Read more</span>
            <i class="fas fa-arrow-right"></i>
          </div>
        </div>`;
      card.addEventListener('click', () => openModal(n));
      grid.appendChild(card);
    });

    // Load more button
    document.getElementById('loadMoreWrap').style.display =
      items.length > visibleCount ? 'block' : 'none';

    AOS.refresh();
  }

  function loadMore() {
    visibleCount += PAGE_SIZE;
    applyFilters();
    window.scrollBy({ top: 300, behavior: 'smooth' });
  }

  // ── MODAL ──
  function openModal(n) {
    const title   = n['title_'    + currentLang] || n.title_en;
    const cat     = n['category_' + currentLang] || n.category_en;
    const content = n['content_'  + currentLang] || n.content_en;

    document.getElementById('modalTitle').textContent = title;
    const badge = document.getElementById('modalBadge');
    badge.textContent = cat;
    badge.className = 'modal-badge ' + getCatClass(cat);
    badge.style.cssText = '';

    const rendered = (typeof marked !== 'undefined') ? marked.parse(content||'') : (content||'');

    // Images
    let imagesHtml = '';
    if (n.images) {
      const arr = Array.isArray(n.images) ? n.images : [n.images];
      if (arr.length === 1) {
        imagesHtml = `<img class="modal-image" src="assets/images/news/${arr[0]}"
          onerror="this.style.display='none'" onclick="openLightbox('assets/images/news/${arr[0]}')">`;
      } else {
        imagesHtml = `<div class="modal-image-gallery">` +
          arr.map(f => `<img src="assets/images/news/${f}"
            onerror="this.style.display='none'"
            onclick="openLightbox('assets/images/news/${f}')">`).join('') +
          `</div>`;
      }
    }

    // YouTube
    let youtubeHtml = '';
    if (n.youtube) {
      const urls = Array.isArray(n.youtube) ? n.youtube : [n.youtube];
      urls.forEach(url => {
        const vid = getYouTubeId(url);
        if (vid) youtubeHtml += `
          <div class="modal-youtube-wrap">
            <div class="modal-youtube-label"><i class="fab fa-youtube" style="color:#e74c3c"></i> Video</div>
            <div class="modal-youtube">
              <iframe src="https://www.youtube.com/embed/${vid}" allowfullscreen loading="lazy"></iframe>
            </div>
          </div>`;
      });
    }

    document.getElementById('modalContent').innerHTML = rendered + imagesHtml + youtubeHtml;
    document.getElementById('modalOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(e) {
    if (e && e.target !== document.getElementById('modalOverlay')) return;
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }
  document.getElementById('modalBox').addEventListener('click', e => e.stopPropagation());

  function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
  }

  function getYouTubeId(url) {
    if (!url) return null;
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/))([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  // ── LOAD DATA ──
  fetch('data/content.json?t=' + Date.now())
    .then(r => r.json())
    .then(data => {
      allNews = data.news || [];
      applyFilters();
    })
    .catch(() => {
      document.getElementById('newsGrid').innerHTML =
        '<div class="empty"><i class="fas fa-exclamation-triangle"></i><p>Gagal load data. Pastikan server Python berjalan.</p></div>';
    });
</script>
</body>
</html>
